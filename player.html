<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registered Players</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
  background:#0b1c2d;
  color:#fff;
}

/* Header */
header{
  background:linear-gradient(90deg,#1e3c72,#2a5298);
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{font-size:18px}

header a{
  background:#ffd700;
  padding:6px 14px;
  border-radius:20px;
  text-decoration:none;
  color:#000;
  font-weight:600;
}

/* Stats */
#playerStats{
  padding:16px;
  text-align:center;
}

.stat-grid{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:12px;
}

.stat-box{
  background:#102840;
  padding:14px;
  border-radius:14px;
  min-width:90px;
}

.stat-box b{
  font-size:20px;
  display:block;
  margin-top:4px;
}

.download-btn{
  margin-top:14px;
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:#ffd700;
  font-weight:bold;
  cursor:pointer;
}

/* Player Cards */
#players{
  padding:16px;
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

@media(min-width:768px){
  #players{grid-template-columns:repeat(2,1fr)}
}

.player-card{
  background:#102840;
  border-radius:14px;
  padding:14px;
  display:flex;
  gap:12px;
  align-items:center;
}

.player-card img{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
}

.player-info p{
  font-size:14px;
  margin-top:2px;
}


footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:linear-gradient(90deg,#1e3c72,#2a5298);
  text-align:center;
  padding:10px;
  font-size:14px;
  z-index:1000;
}

/* prevent content hiding behind footer */
#players{
  padding-bottom:70px;
}



.delete-btn{
  background:red;
  color:greenyellow;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
}



</style>
</head>

<body>

<header>
  <h2>🏏 Registered Players</h2>
  <a href="index.html">Dashboard</a>
</header>

<!-- STATS SECTION -->
<section id="playerStats">
  <h3>Player Statistics</h3>

  <div class="stat-grid">
    <div class="stat-box">Total<b id="totalCount">0</b></div>
    <div class="stat-box">Batsman<b id="batCount">0</b></div>
    <div class="stat-box">Bowler<b id="bowlCount">0</b></div>
    <div class="stat-box">All-Rounder<b id="allCount">0</b></div>
  </div>

  <button class="download-btn" onclick="downloadAllPlayersPDF()">
    ⬇ Download All Players PDF
  </button>
</section>

<!-- PLAYER LIST -->
<section id="players"></section>

<!-- FIREBASE + LOGIC -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",
  authDomain: "jp-boys.firebaseapp.com",
  projectId: "jp-boys",
  storageBucket: "jp-boys.firebasestorage.app",
  messagingSenderId: "1015271887162",
  appId: "1:1015271887162:web:35dbd2b95f3df3f3908003"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const playersDiv = document.getElementById("players");
let players = [];

/* 🔄 REAL-TIME LOAD PLAYERS */
onSnapshot(collection(db,"players"), snap=>{
  players = [];
  snap.forEach(d=>players.push(d.data()));
  updateCounts();
  renderPlayers();
});

/* 📊 UPDATE COUNTS */
function updateCounts(){
  totalCount.textContent = players.length;
  batCount.textContent = players.filter(p=>p.role==="Batsman").length;
  bowlCount.textContent = players.filter(p=>p.role==="Bowler").length;
  allCount.textContent = players.filter(p=>p.role==="All-Rounder").length;
}

/* 👤 RENDER PLAYER LIST */
function renderPlayers(){
  playersDiv.innerHTML="";
  players.forEach(p=>{
    playersDiv.innerHTML+=`
      <div class="player-card">
        <img src="${p.photo}">
        <div class="player-info">
          <b>${p.name}</b>
          <p>📞 ${p.mobile}</p>
          <p>Role: ${p.role}</p>
        </div>
      </div>
    `;
  });
}

/* 📄 PDF DOWNLOAD */
window.downloadAllPlayersPDF = async () => {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  let y = 10;
  pdf.setFontSize(16);
  pdf.text("Registered Players", 10, y);
  y += 10;

  for(const p of players){
    if(y > 260){
      pdf.addPage();
      y = 10;
    }

    const img = await loadImage(p.photo);

    pdf.addImage(img,"JPEG",10,y,25,25);
    pdf.setFontSize(11);
    pdf.text(`Name: ${p.name}`,40,y+6);
    pdf.text(`Mobile: ${p.mobile}`,40,y+12);
    pdf.text(`Role: ${p.role}`,40,y+18);
    

    y += 34;
  }

  pdf.save("All_Registered_Players.pdf");
};

/* 🖼️ IMAGE HELPER */
function loadImage(url){
  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>{
      const c=document.createElement("canvas");
      c.width=img.width;
      c.height=img.height;
      c.getContext("2d").drawImage(img,0,0);
      resolve(c.toDataURL("image/jpeg"));
    };
    img.src=url;
  });
}

</script>

</body>
</html>
