<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JP Boys Payment Tracker</title>

<!-- ✅ ADD THESE (IMPORTANT) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0b1c2d;
  color:#fff;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

header{
  background:#0d47a1;
  padding:12px;
  display:flex;
  justify-content:space-between;
}


.header-btns button{
 background:#ffd700;
  margin-left:8px;
  padding:6px 10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.container{
  padding:10px;
  flex:1;
}

.form-row{
  display:flex;
  gap:8px;
  flex-wrap:nowrap;
  overflow-x:auto;
}

.form-row input,
.form-row select{
  height:32px;
  padding:0 6px;
  border:none;
  border-radius:5px;
  font-size:13px;
}

#name{width:140px;}
#amount{width:90px;}
#months{width:120px;}
#year{width:80px;}

.btn{
  background:#4caf50;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #444;
  padding:8px;
  text-align:center;
}

.green{color:#00e676;}
.red{color:#ff5252;}
.orange{color:orange;}

footer{
  background:#0d47a1;
  text-align:center;
  padding:8px;
}
</style>
</head>

<body>

<header>
  <div>🏏 JP Boys Payment Tracker</div>
  <div class="header-btns">
    <button onclick="goDashboard()"> Dashboard</button>
    <button onclick="login()">🔐 Finance Manager Login</button>
  </div>

  
</header>

<div class="container">

<div class="form-row">
  <input id="name" placeholder="Player Name">
  <input id="amount" type="number" placeholder="Amount">

  <select id="type">
    <option value="credit">Payment</option>
    <option value="debit" disabled>Expense</option>
  </select>

  <select id="months" multiple>
    <option>Jan</option><option>Feb</option><option>Mar</option>
    <option>Apr</option><option>May</option><option>Jun</option>
    <option>Jul</option><option>Aug</option><option>Sep</option>
    <option>Oct</option><option>Nov</option><option>Dec</option>
  </select>

  <select id="year">
    <option>2026</option>
    <option>2025</option>
  </select>

  <button class="btn" onclick="addEntry()">Add</button>
  <button class="btn" onclick="downloadExcel()">Excel</button>
  <button class="btn" onclick="downloadPDF()">PDF</button>
</div>

<h3>💰 Payments</h3>
<table>
<thead>
<tr>
<th>Name</th><th>Months</th><th>Year</th><th>Amount</th><th>Status</th><th>Action</th>
</tr>
</thead>
<tbody id="paymentTable"></tbody>
</table>

<h3>💸 Expenses</h3>
<table>
<thead>
<tr>
<th>Name</th><th>Months</th><th>Year</th><th>Amount</th>
</tr>
</thead>
<tbody id="expenseTable"></tbody>
</table>

<h3 id="total"></h3>

</div>

<footer>🏏 JP Boy's Cricketer's © 2026 | Developed By KBU Software Pvt Ltd.</footer>

<script>
let payments=[];
let expenses=[];
let isAdmin=false;

// DASHBOARD
function goDashboard(){
  window.location.href="index.html";
}

// LOGIN
function login(){
  let code=prompt("Enter Manager Code");
  if(code==="Umesh@09"){
    isAdmin=true;
    alert("Login Successful ✅");
    document.querySelector('#type option[value="debit"]').disabled=false;
    render();
  }else{
    alert("Wrong Code ❌");
  }
}

// GET MONTHS
function getMonths(){
  let options=document.getElementById("months").options;
  let selected=[];
  for(let i=0;i<options.length;i++){
    if(options[i].selected){
      selected.push(options[i].value);
    }
  }
  return selected;
}

// ADD ENTRY
function addEntry(){
  let name=document.getElementById("name").value;
  let amount=document.getElementById("amount").value;
  let type=document.getElementById("type").value;
  let months=getMonths();
  let year=document.getElementById("year").value;

  if(!name || !amount || months.length===0){
    alert("Fill all fields");
    return;
  }

  if(type==="credit"){
    payments.push({name,amount,months,year,status:"pending"});
  }else{
    if(!isAdmin){
      alert("Only admin can add expense");
      return;
    }
    expenses.push({name,amount,months,year});
  }

  render();
}

// UPDATE STATUS
function updateStatus(i,status){
  payments[i].status=status;
  render();
}

// RENDER
function render(){
  let pHTML="", eHTML="";
  let totalC=0, totalE=0;

  payments.forEach((p,i)=>{
    let statusClass="orange";
    if(p.status==="Paid") statusClass="green";
    if(p.status==="Rejected") statusClass="red";

    if(p.status==="Paid") totalC+=Number(p.amount);

    pHTML+=`
    <tr>
      <td>${p.name}</td>
      <td>${p.months.join(", ")}</td>
      <td>${p.year}</td>
      <td>₹${p.amount}</td>
      <td class="${statusClass}">${p.status}</td>
      <td>
        ${
          isAdmin && p.status==="pending"
          ? `<button onclick="updateStatus(${i},'Paid')">✔</button>
             <button onclick="updateStatus(${i},'Rejected')">✖</button>`
          : ""
        }
      </td>
    </tr>`;
  });

  expenses.forEach(e=>{
    totalE+=Number(e.amount);

    eHTML+=`
    <tr>
      <td>${e.name}</td>
      <td>${e.months.join(", ")}</td>
      <td>${e.year}</td>
      <td>₹${e.amount}</td>
    </tr>`;
  });

  document.getElementById("paymentTable").innerHTML=pHTML;
  document.getElementById("expenseTable").innerHTML=eHTML;

  document.getElementById("total").innerText=
  `Total Credit ₹${totalC} | Expense ₹${totalE} | Balance ₹${totalC-totalE}`;
}

//   XLSX.utils.book_append_sheet(wb, ws, "Payments");

//   XLSX.writeFile(wb, "JP_Boys_Payments.xlsx");

function downloadExcel(){
  let wb = XLSX.utils.book_new();

  // 🔹 Payments Sheet
  let paymentData = payments.map(p => ({
    Name: p.name,
    Months: p.months.join(", "),
    Year: p.year,
    Amount: p.amount,
    Status: p.status
  }));

  let ws1 = XLSX.utils.json_to_sheet(paymentData);
  XLSX.utils.book_append_sheet(wb, ws1, "Payments");

  // 🔹 Expenses Sheet
  let expenseData = expenses.map(e => ({
    Name: e.name,
    Months: e.months.join(", "),
    Year: e.year,
    Amount: e.amount
  }));

  let ws2 = XLSX.utils.json_to_sheet(expenseData);
  XLSX.utils.book_append_sheet(wb, ws2, "Expenses");

  // 🔥 Download
  XLSX.writeFile(wb, "JP_Boys_Full_Report.xlsx");
}

function downloadPDF(){
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  let y = 10;

  // 🔷 TITLE
  doc.setFontSize(16);
  doc.text("JP Boys Financial Report", 10, y);

  y += 10;

  // 🔷 PAYMENTS TABLE HEADER
  doc.setFontSize(12);
  doc.text("Payments", 10, y);
  y += 8;

  doc.setFontSize(10);
  doc.text("Name | Months | Year | Amount | Status", 10, y);
  y += 6;

  payments.forEach(p=>{
    doc.text(
      `${p.name} | ${p.months.join(", ")} | ${p.year} | ₹${p.amount} | ${p.status}`,
      10,
      y
    );
    y += 6;

    // Auto next page
    if(y > 270){
      doc.addPage();
      y = 10;
    }
  });

  y += 10;

  // 🔷 EXPENSES TABLE
  doc.setFontSize(12);
  doc.text("Expenses", 10, y);
  y += 8;

  doc.setFontSize(10);
  doc.text("Name | Months | Year | Amount", 10, y);
  y += 6;

  expenses.forEach(e=>{
    doc.text(
      `${e.name} | ${e.months.join(", ")} | ${e.year} | ₹${e.amount}`,
      10,
      y
    );
    y += 6;

    if(y > 270){
      doc.addPage();
      y = 10;
    }
  });

  y += 10;

  // 🔷 TOTAL SUMMARY
  let totalC = payments
    .filter(p => p.status === "Paid")
    .reduce((sum, p) => sum + Number(p.amount), 0);

  let totalE = expenses
    .reduce((sum, e) => sum + Number(e.amount), 0);

  doc.setFontSize(12);
  doc.text(`Total Credit: ₹${totalC}`, 10, y);
  y += 6;
  doc.text(`Total Expense: ₹${totalE}`, 10, y);
  y += 6;
  doc.text(`Balance: ₹${totalC - totalE}`, 10, y);

  // 🔥 DOWNLOAD
  doc.save("JP_Boys_Report.pdf");
}



render();
</script>

</body>
</html>
