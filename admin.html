<div class="box" id="loginBox">
  <h3>Admin Login</h3>
  <input type="email" id="id" placeholder="Admin email">
  <input type="password" id="pwd" placeholder="Admin Password">
  <button class="green" onclick="login()">Login</button>
</div>

<div class="box" id="controlBox" style="display:none">

  


  <!-- ⭐ ADVANCED NOTIFICATION PANEL -->
  <div class="notify">
    <b>📊 Registration Status</b>
    <div id="notifyContent">Loading...</div>
  </div>

  <h3>Auction Control</h3>

<label>Auction ON <input type="checkbox" id="auctionToggle"></label>
<label>Bidding Enabled <input type="checkbox" id="bidToggle"></label>
<label>Enable Player Reset <input type="checkbox" id="resetToggle"></label>
<label>Owner Editing <input type="checkbox" id="ownerToggle"></label>

<button class="yellow" onclick="goVerify()">Verify Payments</button>

<button class="red" id="toggleRegBtn">Disable Registration</button>

<button class="green" onclick="goAuction()">Go to Auction</button>

<button onclick="clearSoldPlayers()">Clear Sold Players</button>
<button class="red" onclick="resetAllPlayers()">RESET ALL PLAYERS</button>
<button class="blue" onclick="resetAuctionSeason()">RESET AUCTION SEASON</button>

</div>

<script>
document.getElementById("resetToggle").onchange = e =>
  localStorage.setItem("playerResetEnabled", e.target.checked);

document.getElementById("resetToggle").checked =
  localStorage.getItem("playerResetEnabled") === "true";

const ADMIN_PASSWORD = "Umesh@09";

function login(){
  if(document.getElementById("pwd").value === ADMIN_PASSWORD){
    localStorage.setItem("isAdmin","true");
    loginBox.style.display="none";
    controlBox.style.display="block";
    loadFlags();
  }else alert("Wrong password");
}

function loadFlags(){
  auctionToggle.checked=localStorage.getItem("auctionEnabled")==="true";
  bidToggle.checked=localStorage.getItem("biddingEnabled")==="true";
}

auctionToggle.onchange=e=>localStorage.setItem("auctionEnabled",e.target.checked);
bidToggle.onchange=e=>localStorage.setItem("biddingEnabled",e.target.checked);

function goAuction(){ window.location.href="auction.html"; }
function goVerify(){ window.location.href="verify.html"; }
</script>

/* =============================
   GLOBAL REGISTRATION TOGGLE
============================= */
/* =============================
   GLOBAL REGISTRATION TOGGLE
   WITH CONFIRMATION MESSAGE
============================= */

const toggleBtn = document.getElementById("toggleRegBtn");

async function refreshToggleText(){

  const snap = await getDoc(doc(db,"settings","registration"));

  const open = snap.exists()
    ? snap.data().open !== false
    : true;

  toggleBtn.textContent = open
    ? "Disable Registration"
    : "Enable Registration";
}


/* CLICK HANDLER */

toggleBtn.onclick = async ()=>{

  const ref = doc(db,"settings","registration");
  const snap = await getDoc(ref);

  const open = snap.exists()
    ? snap.data().open !== false
    : true;

  /* ⭐ Confirmation Dialog */
  const confirmMsg = open
    ? "Do you want to DISABLE registration?"
    : "Do you want to ENABLE registration?";

  if(!confirm(confirmMsg)) return;

  /* ⭐ Update Firestore */
  await setDoc(ref,{ open: !open },{ merge:true });

  /* ⭐ Update Button Text */
  refreshToggleText();
};


/* Initialize Button Text */
refreshToggleText();




/* 🔊 SOUND */
function playAlert(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.frequency.value=880;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime+0.6);
}

window.addEventListener("click",()=>{
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 ctx.resume();
},{once:true});


/* ⭐ REALTIME DASHBOARD STATUS */
let initialized=false;

onSnapshot(collection(db,"players"), snap=>{

  const players=[];
  snap.forEach(d=>players.push(d.data()));

  players.sort((a,b)=>b.createdAt-a.createdAt);

  const total=players.length;
  const latest=players[0]?.name || "None";
  const lastFive=players.slice(0,5);

  notifyContent.innerHTML=`
    Total Registered : <b>${total}</b><br>
    Latest Player : <b>${latest}</b><br><br>

    <div class="small">
    Last 5 Registered:<br>
    ${ lastFive.length
      ? lastFive.map(p=>"• "+p.name).join("<br>")
      : "No registrations yet"
    }
    </div>
  `;

  if(initialized){
    playAlert();
  }

  initialized=true;
});


/* OWNER TOGGLE */
ownerToggle.onchange = async e=>{
 await setDoc(doc(db,"settings","ownerControl"),{
   editingEnabled:e.target.checked
 });
};


/* EXISTING FUNCTIONS — UNCHANGED */
window.resetAllPlayers = async () => {
 if(localStorage.getItem("isAdmin")!=="true") return;
 if(localStorage.getItem("playerResetEnabled")!=="true"){
   alert("Enable Player Reset first"); return;
 }
 if(!confirm("Delete ALL players?")) return;

 const snap = await getDocs(collection(db,"players"));
 for(const d of snap.docs){
   await deleteDoc(doc(db,"players",d.id));
 }
 alert("All players deleted.");
};

window.clearSoldPlayers = async () => {
 const snap = await getDocs(collection(db,"players"));
 const jobs=[];
 snap.forEach(d=>{
   if(d.data().sold===true)
     jobs.push(deleteDoc(doc(db,"players",d.id)));
 });
 await Promise.all(jobs);
 alert("Sold players cleared");
};

window.resetAuctionSeason = async () => {

 if(!confirm("Reset balances + sold data?")) return;

 const jobs=[];

 /* 1️⃣ Reset Team Money */
 const teamSnap = await getDocs(collection(db,"teams"));
 teamSnap.forEach(t=>{
   jobs.push(updateDoc(doc(db,"teams",t.id),{
     money:100000
   }));
 });

 /* 2️⃣ Reset Player Sold Status */
 const playerSnap = await getDocs(collection(db,"players"));
 playerSnap.forEach(p=>{
   jobs.push(updateDoc(doc(db,"players",p.id),{
     sold:false,
     soldAmount:null,
     soldTeam:null,
     soldAt:null
   }));
 });

 /* 3️⃣ 🔥 IMPORTANT — DELETE teamPlayers COLLECTION */
 const teamPlayersSnap = await getDocs(collection(db,"teamPlayers"));
 teamPlayersSnap.forEach(tp=>{
   jobs.push(deleteDoc(doc(db,"teamPlayers",tp.id)));
 });

 await Promise.all(jobs);

 alert("Auction fully reset ✅ (Balances + Sold Data Cleared)");

};
