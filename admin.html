<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Control</title>

<style>
body{
  background:#0b1c2d;
  color:#fff;
  font-family:Segoe UI;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#102840;
  padding:20px;
  border-radius:14px;
  width:300px;
}
h3{text-align:center}
label{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
}
button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
button.green{background:green;color:#fff}
button.yellow{background:#ffd700}
button.red{background:#d9534f;color:#fff}

input[type="password"],
input[type="email"]{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
}
input[type="email"]{background:orange}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="box" id="loginBox">
  <h3>Admin Login</h3>
  <input type="email" id="id" placeholder="Admin email">
  <input type="password" id="pwd" placeholder="Admin Password">
  <button class="green" onclick="login()">Login</button>
</div>

<!-- CONTROL -->
<div class="box" id="controlBox" style="display:none">
  <h3>Auction Control</h3>

  <label>
    Auction ON
    <input type="checkbox" id="auctionToggle">
  </label>

  <label>
    Bidding Enabled
    <input type="checkbox" id="bidToggle">
  </label>

  <label>
    Enable Player Reset
    <input type="checkbox" id="resetToggle">
  </label>

  <button class="yellow" onclick="goVerify()" style="margin-top:12px">
    Verify Payments
  </button>

  <button class="green" onclick="goAuction()" style="margin-top:10px">
    Go to Auction
  </button>

  <!-- 🔥 NEW RESET ALL PLAYERS BUTTON -->
  <button class="red" style="margin-top:14px"
    onclick="resetAllPlayers()">
    RESET ALL PLAYERS
  </button>
</div>

<!-- LOCAL STORAGE FLAGS -->
<script>
document.getElementById("resetToggle").onchange = e =>
  localStorage.setItem("playerResetEnabled", e.target.checked);

document.getElementById("resetToggle").checked =
  localStorage.getItem("playerResetEnabled") === "true";
</script>

<!-- ADMIN LOGIN + TOGGLES -->
<script>
const ADMIN_PASSWORD = "Umesh@09";

function login(){
  if(document.getElementById("pwd").value === ADMIN_PASSWORD){
    localStorage.setItem("isAdmin","true");
    document.getElementById("loginBox").style.display="none";
    document.getElementById("controlBox").style.display="block";
    loadFlags();
  }else{
    alert("Wrong password");
  }
}



function loadFlags(){
  document.getElementById("auctionToggle").checked =
    localStorage.getItem("auctionEnabled")==="true";
  document.getElementById("bidToggle").checked =
    localStorage.getItem("biddingEnabled")==="true";
}

document.getElementById("auctionToggle").onchange = e =>
  localStorage.setItem("auctionEnabled", e.target.checked);

document.getElementById("bidToggle").onchange = e =>
  localStorage.setItem("biddingEnabled", e.target.checked);

function goAuction(){
  window.location.href="auction.html";
}

function goVerify(){
  window.location.href="verify.html";
}
</script>

<!-- 🔥 FIREBASE + RESET LOGIC -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  deleteDoc,
  doc
} from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",
  authDomain: "jp-boys.firebaseapp.com",
  projectId: "jp-boys"
});
const db = getFirestore(app);

/* 🔁 RESET ALL PLAYERS (ADMIN ONLY) */
window.resetAllPlayers = async () => {

  if(localStorage.getItem("isAdmin") !== "true") return;

  if(localStorage.getItem("playerResetEnabled") !== "true"){
    alert("Enable Player Reset first");
    return;
  }

  if(!confirm("This will DELETE ALL PLAYERS. Continue?")) return;

  const snap = await getDocs(collection(db,"players"));

  for(const d of snap.docs){
    await deleteDoc(doc(db,"players",d.id));
  }

  alert("All players deleted. Fresh registration enabled.");
};
</script>

</body>
</html>
