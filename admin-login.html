<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>

<style>

  
   body{
    margin:0;
    background:#0b1c2d;
    color:#fff;
    font-family:"Segoe UI",sans-serif;

    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.box{
    background:#102840;
    width:100%;
    max-width:340px;

    padding:20px;

    border-radius:14px;

    box-shadow:0 0 20px rgba(0,0,0,.35);
}

.box::-webkit-scrollbar{
  width:6px;
}
.box::-webkit-scrollbar-thumb{
  background:#3498db;
  border-radius:10px;
}

h3{text-align:center}

label{
  display:flex;
  justify-content:space-between;
  margin:12px 0;
}

button{
  width:105%;
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

button.green{background:green;color:#fff}
button.yellow{background:#ffd700}
button.red{background:#d9534f;color:#fff}
button.blue{background:#3498db;color:#fff}

input[type="password"],
input[type="email"]{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
}
input[type="email"]{background:orange}

/* ⭐ NEW NOTIFY PANEL */
.notify{
  background:#173d61;
  padding:14px;
  border-radius:12px;
  margin-bottom:14px;
  border-left:5px solid #ffd700;
}

.small{
  font-size:13px;
  opacity:0.9;
}



/* 🔥 SIDE BY SIDE LAYOUT */
.topRow{
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

/* both cards equal width */
.topRow .notify{
  flex:1;
  max-height:200px;   /* prevent overflow */
  overflow-y:auto;
}

/* MOBILE RESPONSIVE */
@media(max-width:600px){
  .topRow{
    flex-direction:column;
  }
}

.notify::-webkit-scrollbar{
  width:5px;
}
.notify::-webkit-scrollbar-thumb{
  background:#3498db;
  border-radius:10px;
}


/* ==========================
   ADMIN PROFILE
========================== */

.profileMenu{
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
}

.profileBtn{
    width:45px;
    height:45px;
    border-radius:50%;
    background-color:gold;
    border:none;
    color:white;
    font-size:22px;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
}

.profileBtn:hover{
    background:gold;
}

.dropdown{
    display:none;
    position:absolute;
    right:0;
    top:55px;
    width:180px;
    background:#102840;
    border-radius:10px;
    overflow-y:auto;
/* overflow-x:hidden; */
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.dropdown div{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.dropdown button{
    width:100%;
    border:none;
    background:none;
    color:white;
    text-align:left;
    padding:12px;
    cursor:pointer;
    font-size:15px;
}

.dropdown button:hover{
    background:#173d61;
}


/* Login Links */

.loginLinks{
    margin-top:18px;
    text-align:center;
}

.loginLinks a{
    display:block;
    text-decoration:none;
    font-size:14px;
    margin-top:12px;
    transition:.3s;
}

.loginLinks a:first-child{
    color:#4db8ff;
}

.loginLinks a:last-child{
    color:#ffd700;
}

.loginLinks a:hover{
    text-decoration:underline;
}

/* ================= HEADER ================= */

.pageHeader{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;

    background:#102840;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:0 3px 12px rgba(0,0,0,.35);

    z-index:999;
}

.homeBtn{

    position:absolute;

    left:20px;

    background:#3498db;

    color:#fff;

    border:none;

    padding:10px 18px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    width:auto;

}

.homeBtn:hover{

    background:#2980b9;

}

.pageTitle{

    color:#ffd700;

    font-size:30px;

    font-weight:bold;

    margin:0;

}


.pageFooter{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    height:50px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#102840;

    color:#d7e6f2;

    font-size:14px;

    box-shadow:0 -3px 12px rgba(0,0,0,.35);

    z-index:999;

}


@media(max-width:600px){

.pageHeader{

    height:60px;

}

.homeBtn{

    left:10px;

    padding:8px 12px;

    font-size:13px;

}

.pageTitle{

    font-size:18px;

}

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="pageHeader">

    <button class="homeBtn"
        onclick="window.location.href='index.html'">
        Home
    </button>

    <h2 class="pageTitle">
        🏏 JP Boy's Cricketer's
    </h2>

</header>


<div class="box" id="loginBox">

    <h3>Admin Login</h3>

    <input
        type="email"
        id="id"
        placeholder="Admin email">

    <input
        type="password"
        id="pwd"
        placeholder="Admin Password">

    <button
        class="green"
        onclick="login()">
        Login
    </button>

    <!-- Links -->
    <div class="loginLinks">

        <a href="setup-admin.html">
           Don't have an Organizer Account?
                Create One
        </a>

        <a href="forgot-password.html">
            Forgot Password? Reset Password
        </a>

    </div>

</div>




<div class="box" id="controlBox" style="display:none"> 

  </div>



<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,  
  deleteDoc,
  doc,
  updateDoc,
  setDoc,
  addDoc,  
  onSnapshot,
  limit,
  query,
  where,
  increment
} from
"https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",
  authDomain: "jp-boys.firebaseapp.com",
  projectId: "jp-boys"
});
const db = getFirestore(app);

window.login = async function () {

    const email = document.getElementById("id").value.trim();
    const password = document.getElementById("pwd").value;

    if(email==="" || password===""){
        alert("Enter Email & Password");
        return;
    }

    const q = query(
        collection(db,"admins"),
        where("email","==",email)
    );

    const snap = await getDocs(q);

    if(snap.empty){
        alert("Organizer not found");
        return;
    }

    const admin = snap.docs[0].data();

    if(admin.password !== password){
        alert("Wrong Password");
        return;
    }

    // Save session
    localStorage.setItem("isAdmin","true");
    localStorage.setItem("adminEmail",admin.email);
    console.log("Saved Email:", localStorage.getItem("adminEmail"));
    localStorage.setItem("adminName",admin.name);

    // Redirect
    window.location.href = "admin-dashboard.html";

};


</script>

<!-- ================= FOOTER ================= -->

<footer class="pageFooter">

   🏏 JP Boy's Cricketer's © 2026 | Developed By KBU Software Pvt Ltd.

</footer>

</body>
</html>
