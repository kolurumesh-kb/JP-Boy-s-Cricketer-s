</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import{
getFirestore,
collection,
query,
where,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const app = initializeApp({

apiKey:"AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",
authDomain:"jp-boys.firebaseapp.com",
projectId:"jp-boys"

});

const db=getFirestore(app);

window.sendOtp = async function(){

const mobile=document.getElementById("mobile").value.trim();

if(mobile==""){

    alert("Enter Mobile Number");

    return;

}

const q=query(

collection(db,"admins"),

where("mobile","==",mobile)

);

const snap=await getDocs(q);

if(snap.empty){

    alert("Mobile Number Not Registered");

    return;

}

const adminDoc=snap.docs[0];

const adminId=adminDoc.id;

/* Generate New Password */

const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let newPassword="JP";

for(let i=0;i<6;i++){

newPassword+=chars.charAt(

Math.floor(Math.random()*chars.length)

);

}

/* Update Firestore */

await updateDoc(

doc(db,"admins",adminId),

{

password:newPassword

}

);

/* Show Password */

// alert(

// "Password Reset Successful.\n\n"+

// "Your New Password is:\n\n"+

// newPassword+

// "\n\nPlease login using this password."

// );

document.getElementById("generatedPassword").innerHTML = newPassword;

document.getElementById("successPopup").style.display = "flex";

window.generatedPassword = newPassword;

// /* Redirect */

// window.location.href="admin-login.html";

}


window.copyPassword = async function(){

try{

await navigator.clipboard.writeText(window.generatedPassword);

alert("Password copied successfully.");

}
catch(e){

alert("Unable to copy password.");

}

}

window.goLogin = function(){

window.location.href = "admin-login.html";

}

</script>

</body>
