<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Create Admin</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{

background:#081b29;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.box{

background:#102840;

padding:30px;

border-radius:15px;

width:380px;

box-shadow:0 0 20px rgba(0,0,0,.4);

}

h2{

text-align:center;

color:white;

margin-bottom:20px;

}

input{

width:100%;

padding:12px;

margin-bottom:15px;

border:none;

border-radius:10px;

font-size:15px;

}

button{

width:100%;

padding:12px;

border:none;

border-radius:10px;

background:#28a745;

color:white;

font-size:17px;

cursor:pointer;

font-weight:bold;

}

button:hover{

background:#23913d;

}

#msg{

margin-top:15px;

text-align:center;

font-weight:bold;

color:#00ff7f;

}

label{display:block;margin-top:12px}

input{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:none;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Admin</h2>

<label>Full Name</label>
<input id="name" placeholder="Enter Name" required>


<label>Mobile Number</label>
<input
type="tel"
id="mobile"
placeholder="Enter Mobile Number">


<label>Email-ID</label>
<input
type="email"
id="email"
placeholder="Email">

<label>Password</label>
<input
type="password"
id="password"
placeholder="Password">

<label>Confirm Password</label>
<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button onclick="createAdmin()">

Create Admin

</button>

<div id="msg"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {

getFirestore,

collection,

addDoc,

query,

where,

getDocs

}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


const app = initializeApp({

apiKey: "AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",

authDomain: "jp-boys.firebaseapp.com",

projectId: "jp-boys"

});

const db = getFirestore(app);


window.createAdmin = async function(){

const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const password=document.getElementById("password").value;

const confirm=document.getElementById("confirmPassword").value;

const msg=document.getElementById("msg");

msg.innerHTML="";

if(!name || !email || !password || !confirm){

alert("Please fill all fields");

return;

}

if(password!==confirm){

alert("Passwords do not match");

return;

}

// Check email already exists

const q=query(

collection(db,"admins"),

where("email","==",email)

);

const snap=await getDocs(q);

if(!snap.empty){

alert("Admin already exists with this email.");

return;

}


const mobile = document.getElementById("mobile").value.trim();


// Save Admin

await addDoc(

collection(db,"admins"),

{

name,

email,

mobile,

password,

createdAt:Date.now()

}

);

msg.innerHTML="✅ Organizer created successfully!   Please login...."  ;

setTimeout(()=>{

window.location.href="admin-login.html";

},2000);

}

</script>

</body>
</html>
