<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Approval Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/* CSS COMING IN PART 2 */

/* ===========================
        GLOBAL
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:linear-gradient(135deg,#081b29,#0f2942);

    color:#fff;

    min-height:100vh;

    padding:25px;

}

/* ===========================
        HEADER
=========================== */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;

    flex-wrap:wrap;

    gap:20px;

}

.header h1{

    font-size:34px;

    font-weight:700;

}

.header p{

    color:#b8d3ea;

    margin-top:6px;

}

.backBtn{

    background:#3498db;

    color:#fff;

    border:none;

    padding:12px 22px;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:.3s;

}

.backBtn:hover{

    background:#1b6fa8;

    transform:translateY(-3px);

}

/* ===========================
        STATS
=========================== */

.statsGrid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(230px,1fr));

gap:20px;

margin-bottom:30px;

}

.statCard{

background:linear-gradient(145deg,#123252,#0c2338);

padding:25px;

border-radius:18px;

text-align:center;

transition:.35s;

box-shadow:0 10px 30px rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.05);

}

.statCard:hover{

transform:translateY(-8px);

}

.statCard i{

font-size:38px;

margin-bottom:15px;

color:#00d4ff;

}

.statCard h2{

font-size:34px;

margin-bottom:8px;

}

.statCard p{

color:#c9d7e5;

}

.pending{

border-left:5px solid orange;

color: orange;

}

.approved{

border-left:5px solid #2ecc71;

color: green;

}

.rejected{

border-left:5px solid #e74c3c;

color: red;

}

/* ===========================
      SEARCH TOOLBAR
=========================== */

.toolbar{

display:flex;

gap:15px;

margin-bottom:30px;

flex-wrap:wrap;

}

.toolbar input{

flex:1;

padding:14px;

border:none;

border-radius:12px;

background:#102840;

color:white;

font-size:15px;

outline:none;

}

.toolbar input::placeholder{

color:#9fb7cb;

}

.toolbar select{

padding:14px;

border:none;

border-radius:12px;

background:#102840;

color:white;

font-size:15px;

cursor:pointer;

outline:none;

min-width:180px;

}

/* ===========================
     PAYMENT GRID
=========================== */

.paymentGrid{

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(350px,1fr));

gap:25px;

}

/* ===========================
       PAYMENT CARD
=========================== */

.paymentCard{

background:linear-gradient(145deg,#133354,#0d243b);

padding:25px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.35);

transition:.35s;

border:1px solid rgba(255,255,255,.05);

position:relative;

overflow:hidden;

}

.paymentCard::before{

content:"";

position:absolute;

top:-60px;

right:-60px;

width:150px;

height:150px;

background:rgba(255,255,255,.04);

border-radius:50%;

}

.paymentCard:hover{

transform:translateY(-8px);

box-shadow:0 20px 40px rgba(0,0,0,.45);

}

.paymentHeader{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:18px;

}

.paymentHeader h3{

font-size:22px;

}

.paymentHeader span{

padding:6px 14px;

border-radius:30px;

font-size:13px;

font-weight:bold;

}


/* ===========================
      STATUS BADGES
=========================== */

.statusPending{
    background:#f39c12;
    color:#fff;
}

.statusApproved{
    background:#27ae60;
    color:#fff;
}

.statusRejected{
    background:#e74c3c;
    color:#fff;
}

/* ===========================
      PAYMENT DETAILS
=========================== */

.details{
    margin-top:15px;
}

.details p{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
    color:#d7e3ef;
    font-size:15px;
    gap:15px;
}

.details p b{
    color:#ffffff;
    min-width:130px;
}

.transactionBox{
    background:#081b29;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    word-break:break-word;
    color:#00d4ff;
    font-weight:bold;
}

.remarksBox{
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    border-radius:10px;
    resize:vertical;
    min-height:70px;
    background:#081b29;
    color:#fff;
    outline:none;
}

/* ===========================
      ACTION BUTTONS
=========================== */

.actionButtons{
    display:flex;
    gap:12px;
    margin-top:18px;
}

.actionButtons button{
    flex:1;
    border:none;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.3s;
}

.approveBtn{
    background:#27ae60;
    color:white;
}

.approveBtn:hover{
    background:#1f8b4d;
    transform:translateY(-3px);
}

.rejectBtn{
    background:#e74c3c;
    color:white;
}

.rejectBtn:hover{
    background:#c0392b;
    transform:translateY(-3px);
}

.cancelBtn{
    background:#7f8c8d;
    color:white;
}

.cancelBtn:hover{
    background:#5f6a6a;
}

/* ===========================
      MODAL
=========================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.modalContent{
    width:100%;
    max-width:500px;
    background:#102840;
    border-radius:20px;
    padding:25px;
    animation:popup .25s ease;
}

@keyframes popup{

    from{
        transform:scale(.85);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

.modalContent h2{
    margin-bottom:15px;
}

.modalContent p{
    margin-bottom:15px;
    color:#d7e3ef;
}

.modalContent textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    border:none;
    border-radius:10px;
    padding:12px;
    outline:none;
    background:#081b29;
    color:white;
}

.modalButtons{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.modalButtons button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

/* ===========================
      LOADER
=========================== */

.loadingBox{
    text-align:center;
    padding:60px;
}

.loader{
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,.15);
    border-top:6px solid #00d4ff;
    border-radius:50%;
    margin:auto;
    animation:spin .9s linear infinite;
}

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

.loadingBox p{
    margin-top:18px;
    color:#c8d6e5;
}

/* ===========================
      EMPTY STATE
=========================== */

.emptyBox{
    text-align:center;
    padding:70px 20px;
}

.emptyBox i{
    font-size:70px;
    color:#7f8c8d;
    margin-bottom:20px;
}

.emptyBox h2{
    margin-bottom:10px;
}

.emptyBox p{
    color:#c8d6e5;
}

/* ===========================
      TOAST
=========================== */

.toast{
    position:fixed;
    right:25px;
    bottom:25px;
    background:#27ae60;
    color:#fff;
    padding:15px 24px;
    border-radius:12px;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
    display:none;
    z-index:99999;
}

/* ===========================
      SCROLLBAR
=========================== */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#3498db;
    border-radius:20px;
}

::-webkit-scrollbar-track{
    background:#081b29;
}

/* ===========================
      MOBILE
=========================== */

@media(max-width:768px){

.header{
    flex-direction:column;
    align-items:flex-start;
}

.header h1{
    font-size:28px;
}

.toolbar{
    flex-direction:column;
}

.toolbar input,
.toolbar select{
    width:100%;
}

.paymentGrid{
    grid-template-columns:1fr;
}

.paymentHeader{
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
}

.details p{
    flex-direction:column;
    align-items:flex-start;
}

.actionButtons{
    flex-direction:column;
}

.modalContent{
    padding:20px;
}

.modalButtons{
    flex-direction:column;
}

}


.deleteBtn{

background:#34495e;
color:white;

}

.deleteBtn:hover{

background:#2c3e50;

}

</style>

</head>

<body>

<!-- ==========================
        HEADER
========================== -->

<div class="header">

    <div>

        <h1>💳 Payment Approval Dashboard</h1>

        <p>
            Verify Tournament Activation Payments
        </p>

    </div>

    <button class="backBtn"
        onclick="window.location.href='admin-dashboard.html'">

        ← Back to Dashboard

    </button>

</div>

<!-- ==========================
        STATISTICS
========================== -->

<div class="statsGrid">

    <div class="statCard">

        <i class="fas fa-file-invoice-dollar"></i>

        <h2 id="totalPayments">
            0
        </h2>

        <p>Total Requests</p>

    </div>

<!-- ==========================

<div class="toolbar">

<input

<!-- ==========================

id="paymentContainer"
class="paymentGrid">

<!-- Firebase Cards Here -->

========================== -->

id="loadingBox"
class="loadingBox">

<div class="loader"></div>

Loading Payment Requests...

<!-- ==========================
      NO PAYMENTS
========================== -->

<div
id="emptyBox"
class="emptyBox"
style="display:none;">

<i class="fas fa-folder-open"></i>

No Payment Requests Found

<!-- ==========================
     APPROVE MODAL
========================== -->

<div
id="approveModal"

<div class="modalContent">

Cancel

<!-- ==========================
      SUCCESS MESSAGE
========================== -->

class="toast">

Payment Updated Successfully

</div>





<script type="module">

/* ===========================
        FIREBASE IMPORTS
=========================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";

import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot,
    updateDoc,
    doc,
    deleteDoc,
     limit,
    where,
    getDocs,
    getDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";


async function verifySuperAdmin(){

    const email =
    localStorage.getItem("adminEmail");

    if(!email){

        location.href="admin-login.html";
        return;
    }

    const q = query(

        collection(db,"admins"),

        where("email","==",email),

        limit(1)

    );

    const snap = await getDocs(q);

    if(snap.empty){

        location.href="admin-dashboard.html";
        return;

    }

    const admin = snap.docs[0].data();

    if(admin.role !== "SUPER_ADMIN"){

        alert(
            "Access Denied.\nOnly Super Admin can access this page."
        );

        location.href="admin-dashboard.html";
        return;

    }

}





/* ===========================
      FIREBASE CONFIG
=========================== */

const app = initializeApp({

    apiKey:"AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",
authDomain:"jp-boys.firebaseapp.com",
projectId:"jp-boys"

});

const db = getFirestore(app);

await verifySuperAdmin();


/* ===========================
      HTML REFERENCES
=========================== */

const paymentContainer =
document.getElementById("paymentContainer");

const loadingBox =
document.getElementById("loadingBox");

const emptyBox =
document.getElementById("emptyBox");

const searchBox =
document.getElementById("searchBox");

const statusFilter =
document.getElementById("statusFilter");


const totalPayments =
document.getElementById("totalPayments");

const pendingPayments =
document.getElementById("pendingPayments");

const approvedPayments =
document.getElementById("approvedPayments");

const rejectedPayments =
document.getElementById("rejectedPayments");


/* ===========================
      GLOBAL VARIABLES
=========================== */

let paymentList = [];

let filteredPayments = [];


/* ===========================
      REALTIME LOADER
=========================== */

const paymentQuery = query(

    collection(db,"paymentRequests"),

    orderBy("createdAt","desc")

);
onSnapshot(paymentQuery, (snapshot) => {

    loadingBox.style.display = "none";

    paymentList = [];

    snapshot.forEach((docSnap) => {

        const data = docSnap.data();

    console.log({
        id: docSnap.id,
        organizerName: data.organizerName,
        organizerEmail: data.organizerEmail,
        paymentMethod: data.paymentMethod,
        paymentStatus: data.paymentStatus,
        transactionId: data.transactionId,
        seasonNumber: data.seasonNumber
    });
        console.log("Document Data:", docSnap.data());

        paymentList.push({
            id: docSnap.id,
            ...docSnap.data()
        });

    });

    console.log(paymentList);

    updateStatistics();
    applyFilters();

});


/* ===========================
      UPDATE STATISTICS
=========================== */

function updateStatistics(){

    totalPayments.innerHTML =
    paymentList.length;

    pendingPayments.innerHTML =

    paymentList.filter(x=>

        x.paymentStatus==="pending"

    ).length;

    approvedPayments.innerHTML =

    paymentList.filter(x=>

        x.paymentStatus==="approved"

    ).length;

    rejectedPayments.innerHTML =

    paymentList.filter(x=>

        x.paymentStatus==="rejected"

    ).length;

}


/* ===========================
      SEARCH
=========================== */

searchBox.addEventListener(

"keyup",

applyFilters

);


/* ===========================
      FILTER
=========================== */

statusFilter.addEventListener(

"change",

applyFilters

);


/* ===========================
      APPLY FILTERS
=========================== */

function applyFilters(){

    const keyword =

    searchBox.value

    .trim()

    .toLowerCase();

    const filter =

    statusFilter.value;

    filteredPayments =

    paymentList.filter(payment=>{

        const matchesSearch =

        (payment.organizerName || "")

        .toLowerCase()

        .includes(keyword)

        ||

        (payment.organizerEmail || "")

        .toLowerCase()

        .includes(keyword);

        const matchesStatus =

        filter==="all"

        ||

        payment.paymentStatus===filter;

        return matchesSearch && matchesStatus;

    });

    renderPayments();

}


/* ===========================
      EMPTY STATE
=========================== */

function renderPayments(){

    paymentContainer.innerHTML="";

    if(filteredPayments.length===0){

        emptyBox.style.display="block";

        paymentContainer.style.display="none";

        return;

    }

    emptyBox.style.display="none";

    paymentContainer.style.display="grid";

    filteredPayments.forEach(payment=>{

        paymentContainer.innerHTML += createCard(payment);

    });

}


/* ===========================
      DATE FORMAT
=========================== */

function formatDate(time){

    if(!time) return "-";

    let date =

    time.toDate

    ?

    time.toDate()

    :

    new Date(time);

    return date.toLocaleString();

}


/* ===========================
      STATUS CLASS
=========================== */

function statusClass(status){

    if(status==="approved")

        return "statusapproved";

    if(status==="rejected")

        return "statusrejected";

    return "statuspending";

}


/* ===========================
      PAYMENT CARD
=========================== */

function createCard(payment){

return `

<div class="paymentCard">

<div class="paymentHeader">

    <input
type="checkbox"
class="paymentCheck"
value="${payment.id}">

<h3>

👤 ${payment.organizerName}

</h3>

<span class="${statusClass(payment.paymentStatus)}">

${(payment.paymentStatus || "pending").toUpperCase()}

</span>

</div>

<div class="details">

<p>

<b>Email</b>

<span>

${payment.organizerEmail}

</span>

</p>

<p>

<b>Season</b>

<span>

${payment.seasonNumber}

</span>

</p>

<p>

<b>Amount</b>

<span>

₹${payment.amount}

</span>

</p>

<p>

<b>Method</b>

<span>

${payment.paymentMethod}

</span>

</p>

<p>

<b>Submitted</b>

<span>

${formatDate(payment.createdAt)}

</span>

</p>

<div class="transactionBox">

Transaction ID

<br><br>

${payment.transactionId}

</div>

<textarea
class="remarksBox"
id="remarks_${payment.id}"
placeholder="Remarks...">${payment.remarks || ""}</textarea>

<div class="actionButtons">

<button
class="approveBtn"
onclick="approvePayment('${payment.id}')">
Approve
</button>

<button
class="rejectBtn"
onclick="rejectPayment('${payment.id}')">
Reject
</button>

<button
class="deleteBtn"
onclick="deletePayment('${payment.id}','${payment.paymentStatus}')">
Delete
</button>

</div>

</div>

</div>

`;

}

/* ==============================
   APPROVE PAYMENT
============================== */

window.approvePayment = async function(requestId){

    if(!confirm("Approve this payment?")) return;

    try{

        const paymentRef = doc(db,"paymentRequests",requestId);

        const paymentSnap = await getDoc(paymentRef);

        if(!paymentSnap.exists()){
            alert("Payment not found");
            return;
        }

        const payment = paymentSnap.data();

        /* ----------------------------------
           Update Payment Request
        -----------------------------------*/

        // await updateDoc(paymentRef,{
        //     // status:"Approved",
        //     paymentStatus:"approved",
        //     approvedAt:Date.now(),
        //     approvedBy:localStorage.getItem("adminEmail")
        // });


        await updateDoc(paymentRef, {

    paymentStatus: "approved",

    

    approvedAt: serverTimestamp(),

    approvedBy: localStorage.getItem("adminEmail"),

    remarks: document.getElementById(`remarks_${requestId}`).value || ""

});

// await updateDoc(tournamentRef,{
//     paymentStatus:"approved"
// });

        /* ----------------------------------
           Update Organizer
        -----------------------------------*/

        const adminQuery = query(
            collection(db,"admins"),
            where("email","==",payment.organizerEmail)
        );

        const adminSnap = await getDocs(adminQuery);

        if(!adminSnap.empty){

            // await updateDoc(adminSnap.docs[0].ref,{
            //     paymentVerified:true
            // });

            await updateDoc(adminSnap.docs[0].ref,{

    paymentVerified:true,

    paymentVerifiedAt:Date.now(),

    lastPaymentAmount:50

});

        }

        /* ----------------------------------
           Activate Tournament
        -----------------------------------*/

        const tournamentQuery = query(
            collection(db,"tournaments"),
            where("organizerEmail","==",payment.organizerEmail),
            where("paymentStatus","==","pending"),
            limit(1)
        );

        const tournamentSnap = await getDocs(tournamentQuery);

        if(!tournamentSnap.empty){

            await updateDoc(
                tournamentSnap.docs[0].ref,
                {
                    // paymentStatus:"PAID",

                    paymentStatus:"approved",
                    amountPaid:50
                }
            );

        }

        alert("✅ Payment Approved Successfully");

    }
    catch(error){

        console.error(error);

        alert("Approval Failed");

    }

};

/* ==============================
   REJECT PAYMENT
============================== */

window.rejectPayment = async function(requestId){

    if(!confirm("Reject this payment?")) return;

    try{

        await updateDoc(
            doc(db,"paymentRequests",requestId),
            {
                // status:"Rejected",
                paymentStatus:"rejected",
                rejectedAt:Date.now(),
                rejectedBy:localStorage.getItem("adminEmail")
            }
        );

        alert("❌ Payment Rejected");

    }
    catch(error){

        console.error(error);

        alert("Reject Failed");

    }

};

//Delete Function

window.deletePayment = async function(id,status){

    if(status==="pending"){

        alert("Pending payments cannot be deleted.");

        return;

    }

    if(!confirm("Delete this payment permanently?"))
        return;

    try{

        await deleteDoc(doc(db,"paymentRequests",id));

        alert("Payment Deleted");

    }
    catch(e){

        console.error(e);

        alert("Delete Failed");

    }

}


//Bulk Delete 

window.deleteSelected = async function(){

    const checks=document.querySelectorAll(".paymentCheck:checked");

    if(checks.length===0){

        alert("Select payments.");

        return;

    }

    if(!confirm("Delete selected payments?"))
        return;

    for(const check of checks){

        const payment=paymentList.find(x=>x.id===check.value);

        if(payment.paymentStatus==="pending")
            continue;

        await deleteDoc(doc(db,"paymentRequests",check.value));

    }

    alert("Selected Payments Deleted");

}


window.toggleAll=function(){

    document.querySelectorAll(".paymentCheck")

    .forEach(x=>{

        x.checked=!x.checked;

    });

}

</script>
