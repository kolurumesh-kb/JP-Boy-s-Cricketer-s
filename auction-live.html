  from{opacity:0;transform:translateX(30px)}

/*Reducing the image size */

function optimizeImage(url){
  if(!url) return "";
  if(!url.includes("res.cloudinary.com")) return url;
  return url.replace("/upload/","/upload/q_auto,f_auto/");
}


/* 🔊 LIVE SOLD VOICE ANNOUNCEMENT */

function speak(text){
  if(!('speechSynthesis' in window)) return;

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "en-IN";
  speech.rate = 0.9;
  speech.pitch = 1;

  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(speech);
}

function announceLiveSale(player){
  const amount = Number(player.soldAmount || 0).toLocaleString("en-IN");
  const message =
    player.name + " sold to " +
    player.soldTeam + " for " +
    amount + " rupees";

  speak(message);
}

onSnapshot(collection(db,"players"), snap => {

  soldPlayers = snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(p=>p.sold)
    .sort((a,b)=>(b.soldAt||0)-(a.soldAt||0));

  if(!soldPlayers.length) return;

  const latest = soldPlayers[0];

  /* BIG CARD */
  latestDiv.innerHTML = `
   <img loading="lazy" src="${optimizeImage(latest.photo)}">

    <h2>${latest.name}</h2>
    <p>${latest.role}</p>
    <p>Sold to <b>${latest.soldTeam}</b></p>
    <h2>₹${latest.soldAmount}</h2>
  `;

  if(!shown.has(latest.id)){
    shown.add(latest.id);
    sound.currentTime=0;
    sound.play().catch(()=>{});
    confetti({particleCount:200,spread:100,origin:{y:.6}});

// 🔊 NEW VOICE ANNOUNCEMENT
  announceLiveSale(latest);

  }

  /* SMALL HISTORY */
  historyDiv.innerHTML="";
  soldPlayers.slice(1,6).forEach(p=>{
    historyDiv.innerHTML+=`
      <div class="small-player">
        <img loading="lazy" src="${optimizeImage(p.photo)}">

        <b>${p.name}</b><br>
        ₹${p.soldAmount}
      </div>
    `;
  });





  renderTeams();
});

/* TEAMS */
function renderTeams(){
  teamsDiv.innerHTML="";
  TEAMS.forEach(t=>{
    const list=soldPlayers.filter(p=>p.soldTeam===t.name);
    teamsDiv.innerHTML+=`
      <div class="team">
        <div class="team-top">
          <img loading="lazy" src="${optimizeImage(t.logo)}">

          <b>${t.name}</b>
        </div>
        ${
          list.length
          ? `<ul>${list.map(p=>`<li>${p.name} - ₹${p.soldAmount}</li>`).join("")}</ul>
             <button onclick="downloadPDF('${t.name.replace(/'/g,"")}')">Download PDF</button>`
          : `<p>No players yet</p>`
        }
      </div>
    `;
  });
}

function loadImageAsBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous"; // IMPORTANT for Cloudinary
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL("image/jpeg"));
    };
    img.onerror = reject;
   img.src = optimizeImage(url);

  });
}

/*   Downloading the team PDF files    */


window.downloadPDF = async (team) => {

  const list = soldPlayers.filter(
    p => p.soldTeam.replace(/'/g,"") === team
  );

  if (!list.length) {
    alert("No players in this team");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  let y = 10;
  pdf.setFontSize(16);
  pdf.text(team, 10, y);
  y += 10;

  for (const p of list) {
    try {
      const imgData = await loadImageAsBase64(p.photo);

      pdf.addImage(imgData, "JPEG", 10, y, 25, 25);
      pdf.setFontSize(12);
      pdf.text(`Name: ${p.name}`, 40, y + 8);
      pdf.text(`Amount: ₹${p.soldAmount}`, 40, y + 16);

      y += 35;

      if (y > 260) {
        pdf.addPage();
        y = 10;
      }
    } catch (e) {
      console.error("Image load failed", e);
    }
  }

  pdf.save(team + ".pdf");
};
