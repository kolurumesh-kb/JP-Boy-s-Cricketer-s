<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Auction – JP Boys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
  margin:0;
  background:#081a2b;
  color:#fff;
  font-family:Segoe UI,sans-serif;
}

/* HEADER */
header{
  background:#123c6b;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dashboard-btn{
  background:#ffeb3b;
  color:#000;
  padding:6px 14px;
  border-radius:20px;
  font-weight:bold;
  text-decoration:none;
}

/* LATEST SOLD (BIG) */
#latestSold{
  margin:20px;
  padding:20px;
  border-radius:18px;
  background:#1fa463;
  text-align:center;
  animation:pop .6s ease;
}

#latestSold img{
  width:150px;
  height:150px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
}

@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* PREVIOUS SOLD (SMALL) */
#soldHistory{
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}

.small-player{
  min-width:160px;
  background:#0f2e4d;
  border-radius:12px;
  padding:10px;
  text-align:center;
  animation:slideIn .5s ease;
}

.small-player img{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  background:#fff;
}

@keyframes slideIn{
  from{opacity:0;transform:translateX(30px)}
  to{opacity:1;transform:translateX(0)}
}

/* TEAMS */
.team{
  background:#0f2e4d;
  margin:10px;
  padding:12px;
  border-radius:12px;
}

.team-top{
  display:flex;
  gap:8px;
  align-items:center;
}

.team-top img{
  width:32px;
  height:32px;
  border-radius:6px;
}

button{
  background:#ffd700;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  margin-top:6px;
}

footer{
  background:#123c6b;
  text-align:center;
  padding:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
  <h2>🏏 JP Boys – Live Auction</h2>
  <a href="index.html" class="dashboard-btn">Dashboard</a>
</header>

<h3 style="text-align:center">🔥 Latest Sold Player</h3>
<div id="latestSold">Waiting for sale...</div>

<h4 style="text-align:center">Previous Sold</h4>
<div id="soldHistory"></div>

<h3 style="text-align:center">Teams</h3>
<div id="teams"></div>

<footer>JP Boys Cricketers © 2026</footer>

<audio id="soldSound">
  <source src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBdlkwG56G7QJSWR9SI2e1LarOUxWg8lW4",
  authDomain: "jp-boys.firebaseapp.com",
  projectId: "jp-boys"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const latestDiv = document.getElementById("latestSold");
const historyDiv = document.getElementById("soldHistory");
const teamsDiv = document.getElementById("teams");
const sound = document.getElementById("soldSound");

let shown = new Set();
let soldPlayers = [];

const TEAMS = [
  {name:"MegaStar Cricketer's",logo:"https://res.cloudinary.com/dwvem4ixh/image/upload/v1770146487/megastar_krtll5.jpg"},
  {name:"Dynamic Daredevils",logo:"https://res.cloudinary.com/dwvem4ixh/image/upload/v1770148161/daredevils_yfqyws.jpg"},
  {name:"Spartan Striker's",logo:"https://res.cloudinary.com/dwvem4ixh/image/upload/v1770148162/spartan_kkb1ih.jpg"},
  {name:"Ghost Rider's",logo:"https://res.cloudinary.com/dwvem4ixh/image/upload/v1770148161/ghost_x1pqzm.jpg"},
  {name:"Trinetra Titans",logo:"https://res.cloudinary.com/dwvem4ixh/image/upload/v1770148161/trinetra_auzzjv.jpg"},
  {name:"Fire Fighter's",logo:"https://res.cloudinary.com/dwvem4ixh/image/upload/v1770148161/firefighter_ekp3wb.jpg"}
];

onSnapshot(collection(db,"players"), snap => {

  soldPlayers = snap.docs
    .map(d=>({id:d.id,...d.data()}))
    .filter(p=>p.sold)
    .sort((a,b)=>(b.soldAt||0)-(a.soldAt||0));

  if(!soldPlayers.length) return;

  const latest = soldPlayers[0];

  /* BIG CARD */
  latestDiv.innerHTML = `
    <img src="${latest.photo}">
    <h2>${latest.name}</h2>
    <p>${latest.role}</p>
    <p>Sold to <b>${latest.soldTeam}</b></p>
    <h2>₹${latest.soldAmount}</h2>
  `;

  if(!shown.has(latest.id)){
    shown.add(latest.id);
    sound.currentTime=0;
    sound.play().catch(()=>{});
    confetti({particleCount:200,spread:100,origin:{y:.6}});
  }

  /* SMALL HISTORY */
  historyDiv.innerHTML="";
  soldPlayers.slice(1).forEach(p=>{
    historyDiv.innerHTML+=`
      <div class="small-player">
        <img src="${p.photo}">
        <b>${p.name}</b><br>
        ₹${p.soldAmount}
      </div>
    `;
  });

  renderTeams();
});

/* TEAMS */
function renderTeams(){
  teamsDiv.innerHTML="";
  TEAMS.forEach(t=>{
    const list=soldPlayers.filter(p=>p.soldTeam===t.name);
    teamsDiv.innerHTML+=`
      <div class="team">
        <div class="team-top">
          <img src="${t.logo}">
          <b>${t.name}</b>
        </div>
        ${
          list.length
          ? `<ul>${list.map(p=>`<li>${p.name} - ₹${p.soldAmount}</li>`).join("")}</ul>
             <button onclick="downloadPDF('${t.name.replace(/'/g,"")}')">Download PDF</button>`
          : `<p>No players yet</p>`
        }
      </div>
    `;
  });
}

function loadImageAsBase64(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous"; // IMPORTANT for Cloudinary
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      resolve(canvas.toDataURL("image/jpeg"));
    };
    img.onerror = reject;
    img.src = url;
  });
}


window.downloadPDF = async (team) => {

  const list = soldPlayers.filter(
    p => p.soldTeam.replace(/'/g,"") === team
  );

  if (!list.length) {
    alert("No players in this team");
    return;
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF();

  let y = 10;
  pdf.setFontSize(16);
  pdf.text(team, 10, y);
  y += 10;

  for (const p of list) {
    try {
      const imgData = await loadImageAsBase64(p.photo);

      pdf.addImage(imgData, "JPEG", 10, y, 25, 25);
      pdf.setFontSize(12);
      pdf.text(`Name: ${p.name}`, 40, y + 8);
      pdf.text(`Amount: ₹${p.soldAmount}`, 40, y + 16);

      y += 35;

      if (y > 260) {
        pdf.addPage();
        y = 10;
      }
    } catch (e) {
      console.error("Image load failed", e);
    }
  }

  pdf.save(team + ".pdf");
};













</script>

</body>
</html>
